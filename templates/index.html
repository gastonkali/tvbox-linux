<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYDRA TV - Tu Centro de Streaming</title>
  <link rel="preconnect" href="https://image.tmdb.org">
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --bg-surface: #12141a;
      --bg-card: #181a24;
      --accent: #e50914;
      --accent-hover: #ff1f2d;
      --accent-glow: rgba(229, 9, 20, 0.45);
      --text-main: #ffffff;
      --text-muted: #a0a5b5;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --focus-ring: #ff3b30;
      --hero-height: 520px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* BARRA SUPERIOR DE NAVEGACIÓN (NAVBAR) */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 36px;
      background: rgba(10, 11, 14, 0.92);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.3s ease;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, #e50914 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover,
    .nav-btn:focus {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-btn.active {
      color: #fff;
      font-weight: 700;
      background: rgba(229, 9, 20, 0.2);
      border: 1px solid rgba(229, 9, 20, 0.4);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* BUSCADOR DEDICADO */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 2px 14px;
      width: 280px;
      transition: all 0.25s ease;
    }

    .search-box:focus-within {
      width: 360px;
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .search-icon {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-right: 8px;
    }

    .search-input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.92rem;
      width: 100%;
      padding: 8px 0;
      outline: none;
    }

    .search-input::placeholder {
      color: #717789;
    }

    .search-clear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      display: none;
    }

    .search-clear:hover {
      color: #fff;
    }

    /* MODO DE REPRODUCCIÓN (AQUÍ VS TV) */
    .playback-toggle {
      display: flex;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 3px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
    }

    .mode-btn:hover {
      color: #fff;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      flex: 1;
      width: 100%;
      position: relative;
    }

    /* =========================================
       1. VISTA DE INICIO (ESTILO NETFLIX HERO & RAILS)
       ========================================= */
    #viewHome {
      display: block;
    }

    /* HERO BILLBOARD */
    .hero {
      position: relative;
      height: var(--hero-height);
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 0 48px 60px 48px;
      background: #000;
    }

    .hero-video-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      pointer-events: none;
      z-index: 1;
    }

    .hero-video-wrap.active {
      opacity: 1;
    }

    .hero-video-wrap iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100%;
      min-width: 177.77vh;
      transform: translate(-50%, -50%) scale(1.15);
      pointer-events: none;
      filter: brightness(0.72) contrast(1.05);
    }

    .hero-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      filter: brightness(0.65);
      transition: opacity 1s ease;
      z-index: 2;
    }

    .hero-backdrop.fade-out {
      opacity: 0;
    }

    .hero-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgba(10, 11, 14, 0.95) 0%, rgba(10, 11, 14, 0.7) 45%, rgba(10, 11, 14, 0.2) 100%),
                  linear-gradient(0deg, var(--bg-dark) 0%, rgba(10, 11, 14, 0.4) 40%, transparent 100%);
      z-index: 3;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 680px;
    }

    .hero-badges {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .badge-spotlight {
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .badge-pill {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 14px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      letter-spacing: -0.5px;
    }

    .hero-desc {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #d1d5db;
      margin-bottom: 24px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-hero-play {
      background: #fff;
      color: #000;
      border: none;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-hero-play:hover,
    .btn-hero-play:focus {
      background: rgba(255, 255, 255, 0.85);
      transform: scale(1.04);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
    }

    .btn-hero-tv {
      background: rgba(229, 9, 20, 0.85);
      color: #fff;
      border: 1px solid var(--accent);
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-hero-tv:hover,
    .btn-hero-tv:focus {
      background: var(--accent);
      transform: scale(1.04);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-hero-list {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-hero-list:hover,
    .btn-hero-list:focus {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.04);
    }

    .btn-hero-trailer {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-hero-trailer:hover,
    .btn-hero-trailer:focus {
      background: rgba(255, 255, 255, 0.35);
      border-color: #fff;
      transform: scale(1.04);
    }

    .hero-sound-btn {
      position: absolute;
      bottom: 60px;
      right: 48px;
      z-index: 20;
      background: rgba(10, 11, 14, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      backdrop-filter: blur(10px);
    }

    .hero-sound-btn:hover,
    .hero-sound-btn:focus {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.12);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* BOTÓN TRAILER EN TARJETAS */
    .card-trailer-btn {
      position: absolute;
      bottom: 60px;
      left: 8px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 5;
    }

    .card:hover .card-trailer-btn,
    .card:focus .card-trailer-btn {
      opacity: 1;
    }

    .card-trailer-btn:hover {
      transform: scale(1.15);
      background: var(--accent);
      border-color: var(--accent);
    }

    /* MODAL DE TRAILER OFICIAL (OPCIÓN 2) */
    .trailer-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .trailer-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .trailer-modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .trailer-modal-dialog {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 960px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 25px var(--accent-glow);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .trailer-modal.open .trailer-modal-dialog {
      transform: scale(1);
    }

    .trailer-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.03);
    }

    .trailer-modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .trailer-modal-close {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-size: 1.1rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .trailer-modal-close:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.1);
    }

    .trailer-modal-player-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }

    .trailer-modal-player-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* FILAS HORIZONTALES (RAILS TIPO NETFLIX) */
    .rails-container {
      padding: 20px 48px 60px 48px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .rail-section {
      position: relative;
    }

    .rail-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .rail-title-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .rail-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .rail-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .rail-see-all {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s ease;
    }

    .rail-see-all:hover,
    .rail-see-all:focus {
      color: var(--accent);
    }

    /* PISTA DESLIZABLE */
    .rail-wrapper {
      position: relative;
    }

    .rail-track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 12px 4px 18px 4px;
      scrollbar-width: none;
    }

    .rail-track::-webkit-scrollbar {
      display: none;
    }

    .rail-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 90px;
      background: rgba(10, 11, 14, 0.85);
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.2s ease, background 0.2s ease;
      border-radius: 6px;
      outline: none;
    }

    .rail-wrapper:hover .rail-arrow {
      opacity: 1;
    }

    .rail-arrow:hover,
    .rail-arrow:focus {
      background: var(--accent);
      opacity: 1;
    }

    .rail-arrow.left {
      left: -22px;
    }

    .rail-arrow.right {
      right: -22px;
    }

    /* TARJETA DE PÓSTER */
    .card {
      flex: 0 0 185px;
      scroll-snap-align: start;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-card);
      border: 2px solid transparent;
      cursor: pointer;
      outline: none;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover,
    .card:focus {
      transform: scale(1.08) translateY(-6px);
      border-color: var(--focus-ring);
      box-shadow: 0 12px 30px rgba(229, 9, 20, 0.4);
      z-index: 15;
    }

    .card-poster-wrap {
      width: 100%;
      height: 275px;
      position: relative;
      background: #141721;
    }

    .card-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-badge-year {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      backdrop-filter: blur(5px);
    }

    .card-badge-type {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-info {
      padding: 10px 10px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: linear-gradient(180deg, #181a24 0%, #11131b 100%);
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .card-fav-btn {
      position: absolute;
      bottom: 60px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffd700;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 5;
    }

    .card:hover .card-fav-btn,
    .card:focus .card-fav-btn {
      opacity: 1;
    }

    .card-fav-btn:hover {
      transform: scale(1.15);
      background: #000;
    }

    /* =========================================
       2. VISTA DE CUADRÍCULA PAGINADA (SIN SCROLL INFINITO)
       ========================================= */
    #viewGrid {
      display: none;
      padding: 30px 48px 60px 48px;
    }

    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
    }

    .grid-title-wrap h2 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .grid-title-wrap p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .grid-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back-home {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-back-home:hover,
    .btn-back-home:focus {
      background: rgba(255, 255, 255, 0.2);
      border-color: #fff;
    }

    /* BARRA DE FILTROS DE CATEGORÍAS / GÉNEROS */
    .genre-pills-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding: 4px 4px 14px 4px;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .genre-pills-bar::-webkit-scrollbar {
      display: none;
    }

    .genre-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 22px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      outline: none;
      user-select: none;
    }

    .genre-pill:hover,
    .genre-pill:focus {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .genre-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 2px 14px var(--accent-glow);
      transform: translateY(-2px);
    }

    .genre-pill-icon {
      font-size: 1rem;
    }

    /* GRID LAYOUT (6 COLUMNAS) */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .catalog-grid .card {
      flex: unset;
      scroll-snap-align: unset;
    }

    /* BARRA DE PAGINACIÓN COMPLETA */
    .pagination-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px 0;
      border-top: 1px solid var(--border-subtle);
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .page-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 0.92rem;
      font-weight: 600;
      min-width: 42px;
      height: 42px;
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-btn:hover:not(:disabled),
    .page-btn:focus:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      border-color: #fff;
      color: #fff;
    }

    .page-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-ellipsis {
      color: var(--text-muted);
      padding: 0 6px;
      font-size: 1.1rem;
    }

    .pagination-jump {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .jump-input {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: #fff;
      width: 65px;
      height: 36px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.92rem;
      outline: none;
    }

    .jump-input:focus {
      border-color: var(--accent);
    }

    .btn-jump {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-subtle);
      color: #fff;
      height: 36px;
      padding: 0 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-jump:hover {
      background: var(--accent);
    }

    /* ESTADO VACÍO */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
    }

    .empty-state-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 24px;
    }

    /* TOAST DE NOTIFICACIÓN */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(18, 20, 26, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px var(--accent-glow);
      z-index: 2000;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* SPINNER DE CARGA */
    .spinner-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 0;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .navbar {
        padding: 10px 20px;
        flex-wrap: wrap;
      }
      .hero {
        padding: 0 20px 40px 20px;
        height: 420px;
      }
      .hero-title {
        font-size: 2rem;
      }
      .rails-container,
      #viewGrid {
        padding: 20px;
      }
      .search-box {
        width: 200px;
      }
      .search-box:focus-within {
        width: 240px;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar" role="navigation">
    <div class="nav-left">
      <div class="brand" id="brandLogo" tabindex="0">
        <span class="brand-title">HYDRA</span>
        <span class="brand-badge">TV</span>
      </div>
      <ul class="nav-links">
        <li><button class="nav-btn active" id="btnNavInicio" data-nav="inicio">🏠 Inicio</button></li>
        <li><button class="nav-btn" id="btnNavEstrenos" data-nav="estrenos">🔥 Estrenos</button></li>
        <li><button class="nav-btn" id="btnNavPeliculas" data-nav="peliculas">🎬 Películas</button></li>
        <li><button class="nav-btn" id="btnNavSeries" data-nav="series">📺 Series</button></li>
        <li><button class="nav-btn" id="btnNavMiLista" data-nav="mi_lista">⭐ Mi Lista</button></li>
      </ul>
    </div>

    <div class="nav-right">
      <!-- Buscador -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar título o saga... (Presiona /)" autocomplete="off">
        <button class="search-clear" id="btnClearSearch">✕</button>
      </div>

      <!-- Selector de Destino de Reproducción -->
      <div class="playback-toggle">
        <button class="mode-btn" id="btnPlayHere" title="Abrir video en este navegador">💻 Ver Aquí</button>
        <button class="mode-btn active" id="btnPlayTv" title="Enviar video a la TV (Ubuntu)">📺 Enviar a TV</button>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main>
    <!-- =========================================
         1. VISTA DE INICIO (NETFLIX HERO & RAILS)
         ========================================= -->
    <div id="viewHome">
      <!-- HERO BILLBOARD DESTACADO -->
      <section class="hero" id="heroBillboard">
        <!-- Fondo de video dinámico para trailers estilo Netflix -->
        <div class="hero-video-wrap" id="heroVideoWrap">
          <iframe id="heroVideoFrame" src="" allow="autoplay; encrypted-media" frameborder="0"></iframe>
        </div>
        <img class="hero-backdrop" id="heroBackdrop" src="" alt="Portada Destacada">
        <div class="hero-gradient"></div>
        <div class="hero-content">
          <div class="hero-badges">
            <span class="badge-spotlight" id="heroBadgeSpotlight">🔥 ESTRENO EXCLUSIVO 2026</span>
            <span class="badge-pill" id="heroYear">2026</span>
            <span class="badge-pill">FULL HD</span>
            <span class="badge-pill">AUDIO LATINO</span>
          </div>
          <h1 class="hero-title" id="heroTitle">Cargando estreno...</h1>
          <p class="hero-desc" id="heroDesc">Disfruta de las mejores películas y series directamente en tu TV con máxima velocidad y cero publicidad.</p>
          <div class="hero-actions">
            <button class="btn-hero-play" id="heroBtnPlay">▶ Reproducir</button>
            <button class="btn-hero-tv" id="heroBtnTv">📺 Enviar a la TV</button>
            <button class="btn-hero-trailer" id="heroBtnTrailer">🎬 Ver Trailer</button>
            <button class="btn-hero-list" id="heroBtnList">+ Mi Lista</button>
          </div>
        </div>
        <!-- Botón flotante de control de sonido del trailer -->
        <button class="hero-sound-btn" id="heroSoundBtn" title="Activar sonido" style="display: none;">🔇</button>
      </section>

      <!-- FILAS TEMÁTICAS TIPO NETFLIX -->
      <div class="rails-container" id="railsContainer">
        <div class="spinner-wrap">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- =========================================
         2. VISTA DE CUADRÍCULA PAGINADA
         ========================================= -->
    <div id="viewGrid">
      <div class="grid-header">
        <div class="grid-title-wrap">
          <h2 id="gridTitle">Películas</h2>
          <p id="gridSubtitle">Explorando catálogo</p>
        </div>
        <div class="grid-actions">
          <button class="btn-back-home" id="btnGridBack">🏠 Volver a Inicio</button>
        </div>
      </div>

      <!-- Barra interactiva de filtros de categorías / géneros -->
      <div class="genre-pills-bar" id="genrePillsBar" style="display: none;" role="tablist" aria-label="Filtros por categoría"></div>

      <!-- Cuadrícula de tarjetas -->
      <div class="catalog-grid" id="catalogGrid">
        <!-- Renderizado dinámico -->
      </div>

      <!-- Barra de paginación completa -->
      <div class="pagination-bar" id="paginationBar">
        <div class="pagination-controls" id="paginationControls">
          <!-- Botones de página dinámicos -->
        </div>
        <div class="pagination-jump">
          <span>Ir a página:</span>
          <input type="number" class="jump-input" id="jumpInput" min="1" value="1">
          <button class="btn-jump" id="btnJump">Ir</button>
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL DE TRAILER OFICIAL (OPCIÓN 2) -->
  <div class="trailer-modal" id="trailerModal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="trailerModalTitle">
    <div class="trailer-modal-backdrop" id="trailerModalBackdrop"></div>
    <div class="trailer-modal-dialog">
      <div class="trailer-modal-header">
        <h3 class="trailer-modal-title" id="trailerModalTitle">🎬 Trailer Oficial</h3>
        <button class="trailer-modal-close" id="trailerModalClose" title="Cerrar (Esc)">✕</button>
      </div>
      <div class="trailer-modal-body">
        <div class="trailer-modal-player-wrap">
          <iframe id="trailerModalFrame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen frameborder="0"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST FLOTANTE -->
  <div class="toast" id="toast"></div>

  <!-- SCRIPT CLIENTE -->
  <script>
    'use strict';

    // ESTADO DE LA APLICACIÓN
    const state = {
      view: 'home',             // 'home' | 'grid'
      section: 'inicio',        // 'inicio', 'estrenos', 'peliculas', 'series', 'mi_lista'
      genre: 'todos',           // 'todos', 'accion', 'terror', etc.
      query: '',
      page: 1,
      limit: 36,
      totalPages: 1,
      totalItems: 0,
      playbackTarget: (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'tv' : 'here',
      heroItem: null,
      heroTrailerTimer: null,
      heroSoundMuted: true,
      myList: new Set(JSON.parse(localStorage.getItem('hydra_my_list') || '[]'))
    };

    // ELEMENTOS DOM
    const el = {
      btnNavInicio: document.getElementById('btnNavInicio'),
      btnNavEstrenos: document.getElementById('btnNavEstrenos'),
      btnNavPeliculas: document.getElementById('btnNavPeliculas'),
      btnNavSeries: document.getElementById('btnNavSeries'),
      btnNavMiLista: document.getElementById('btnNavMiLista'),
      brandLogo: document.getElementById('brandLogo'),
      searchInput: document.getElementById('searchInput'),
      btnClearSearch: document.getElementById('btnClearSearch'),
      btnPlayHere: document.getElementById('btnPlayHere'),
      btnPlayTv: document.getElementById('btnPlayTv'),
      viewHome: document.getElementById('viewHome'),
      viewGrid: document.getElementById('viewGrid'),
      heroBillboard: document.getElementById('heroBillboard'),
      heroVideoWrap: document.getElementById('heroVideoWrap'),
      heroVideoFrame: document.getElementById('heroVideoFrame'),
      heroBackdrop: document.getElementById('heroBackdrop'),
      heroTitle: document.getElementById('heroTitle'),
      heroYear: document.getElementById('heroYear'),
      heroDesc: document.getElementById('heroDesc'),
      heroBtnPlay: document.getElementById('heroBtnPlay'),
      heroBtnTv: document.getElementById('heroBtnTv'),
      heroBtnTrailer: document.getElementById('heroBtnTrailer'),
      heroBtnList: document.getElementById('heroBtnList'),
      heroSoundBtn: document.getElementById('heroSoundBtn'),
      trailerModal: document.getElementById('trailerModal'),
      trailerModalBackdrop: document.getElementById('trailerModalBackdrop'),
      trailerModalTitle: document.getElementById('trailerModalTitle'),
      trailerModalClose: document.getElementById('trailerModalClose'),
      trailerModalFrame: document.getElementById('trailerModalFrame'),
      railsContainer: document.getElementById('railsContainer'),
      gridTitle: document.getElementById('gridTitle'),
      gridSubtitle: document.getElementById('gridSubtitle'),
      btnGridBack: document.getElementById('btnGridBack'),
      genrePillsBar: document.getElementById('genrePillsBar'),
      catalogGrid: document.getElementById('catalogGrid'),
      paginationBar: document.getElementById('paginationBar'),
      paginationControls: document.getElementById('paginationControls'),
      jumpInput: document.getElementById('jumpInput'),
      btnJump: document.getElementById('btnJump'),
      toast: document.getElementById('toast')
    };

    // CONFIGURACIÓN DE GÉNEROS Y CATEGORÍAS TEMÁTICAS
    const GENRES_CONFIG = {
      peliculas: [
        { id: 'todos', label: 'Todas las Películas', icon: '🎬' },
        { id: 'accion', label: 'Acción', icon: '💥' },
        { id: 'ciencia-ficcion', label: 'Ciencia Ficción', icon: '🚀' },
        { id: 'terror', label: 'Terror y Suspenso', icon: '👻' },
        { id: 'comedia', label: 'Comedia', icon: '😂' },
        { id: 'drama', label: 'Drama', icon: '🎭' },
        { id: 'aventura-fantasia', label: 'Aventura y Fantasía', icon: '⚔️' },
        { id: 'animacion', label: 'Animación y Familia', icon: '🎨' },
        { id: 'crimen-suspenso', label: 'Crimen y Misterio', icon: '🔍' },
        { id: 'romance', label: 'Romance', icon: '❤️' }
      ],
      series: [
        { id: 'todos', label: 'Todas las Series', icon: '📺' },
        { id: 'accion', label: 'Acción y Aventura', icon: '💥' },
        { id: 'ciencia-ficcion', label: 'Ciencia Ficción', icon: '🚀' },
        { id: 'terror', label: 'Terror y Misterio', icon: '👻' },
        { id: 'drama', label: 'Drama', icon: '🎭' },
        { id: 'comedia', label: 'Comedia', icon: '😂' },
        { id: 'crimen-suspenso', label: 'Crimen y Policial', icon: '🔍' },
        { id: 'animacion', label: 'Animación y Anime', icon: '🎨' },
        { id: 'romance', label: 'Romance', icon: '❤️' }
      ]
    };

    function renderGenrePills(seccion) {
      if (!el.genrePillsBar) return;

      const generos = GENRES_CONFIG[seccion];
      if (!generos || state.query) {
        el.genrePillsBar.style.display = 'none';
        el.genrePillsBar.innerHTML = '';
        return;
      }

      el.genrePillsBar.style.display = 'flex';
      el.genrePillsBar.innerHTML = '';

      generos.forEach(g => {
        const btn = document.createElement('button');
        const isActive = (state.genre === g.id);
        btn.className = 'genre-pill' + (isActive ? ' active' : '');
        btn.innerHTML = `<span class="genre-pill-icon">${g.icon}</span> <span>${g.label}</span>`;
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        btn.tabIndex = 0;

        btn.addEventListener('click', () => {
          if (state.genre === g.id) return;
          state.genre = g.id;
          el.genrePillsBar.querySelectorAll('.genre-pill').forEach(p => {
            p.classList.remove('active');
            p.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

          cargarGrid(state.section, 1, state.query, state.genre);
        });

        el.genrePillsBar.appendChild(btn);
      });
    }

    // 1. INICIALIZAR Y GESTIÓN DE VISTAS
    function init() {
      setupEventListeners();
      updatePlaybackTargetUI();
      cargarInicio();
    }

    function switchView(viewName) {
      state.view = viewName;
      if (viewName === 'home') {
        el.viewHome.style.display = 'block';
        el.viewGrid.style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        detenerHeroTrailer();
        el.viewHome.style.display = 'none';
        el.viewGrid.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function setActiveNav(btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    // 2. CARGA DE LA VISTA INICIO (NETFLIX HERO & RAILS)
    async function cargarInicio() {
      switchView('home');
      setActiveNav(el.btnNavInicio);
      state.section = 'inicio';

      try {
        const res = await fetch('/api/inicio');
        const data = await res.json();

        // Configurar Hero Billboard
        if (data.hero && data.hero.id) {
          state.heroItem = data.hero;
          el.heroTitle.innerText = data.hero.titulo;
          el.heroYear.innerText = data.hero.anio || '2026';
          el.heroBackdrop.src = data.hero.poster ? data.hero.poster.replace('/w500/', '/original/') : '';
          updateHeroListBtn();
          iniciarHeroTrailer(data.hero);
        }

        // Renderizar Filas Temáticas
        renderRails(data.filas || []);
      } catch (e) {
        console.error('Error cargando inicio:', e);
      }
    }

    function renderRails(filas) {
      el.railsContainer.innerHTML = '';

      filas.forEach((fila, fIndex) => {
        if (!fila.items || !fila.items.length) return;

        const sec = document.createElement('section');
        sec.className = 'rail-section';

        sec.innerHTML = `
          <div class="rail-header">
            <div class="rail-title-group">
              <h2 class="rail-title">${fila.titulo}</h2>
              <span class="rail-subtitle">${fila.subtitulo}</span>
            </div>
            <button class="rail-see-all" data-sec-id="${fila.id}">Ver todo (${fila.items.length}+) ▶</button>
          </div>
          <div class="rail-wrapper">
            <button class="rail-arrow left" aria-label="Anterior">❮</button>
            <div class="rail-track" id="railTrack_${fIndex}"></div>
            <button class="rail-arrow right" aria-label="Siguiente">❯</button>
          </div>
        `;

        const track = sec.querySelector('.rail-track');
        fila.items.forEach(item => {
          track.appendChild(createCard(item));
        });

        // Eventos de flechas
        const btnLeft = sec.querySelector('.rail-arrow.left');
        const btnRight = sec.querySelector('.rail-arrow.right');
        btnLeft.addEventListener('click', () => {
          track.scrollBy({ left: -track.clientWidth * 0.75, behavior: 'smooth' });
        });
        btnRight.addEventListener('click', () => {
          track.scrollBy({ left: track.clientWidth * 0.75, behavior: 'smooth' });
        });

        // Evento ver todo
        sec.querySelector('.rail-see-all').addEventListener('click', () => {
          abrirSeccionGrid(fila.id, fila.titulo);
        });

        el.railsContainer.appendChild(sec);
      });
    }

    // 3. CREACIÓN DE TARJETAS DE CONTENIDO
    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.tabIndex = 0;
      card.dataset.id = item.id;

      const isFav = state.myList.has(item.id);
      const yearBadge = item.anio ? `<span class="card-badge-year">${item.anio}</span>` : '';
      const typeBadge = item.es_serie ? `<span class="card-badge-type">Serie</span>` : `<span class="card-badge-type">Película</span>`;
      const posterUrl = item.poster || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="185" height="275" fill="%23181a24"><rect width="100%" height="100%"/><text x="50%" y="50%" fill="%23fff" text-anchor="middle">Sin Imagen</text></svg>';

      card.innerHTML = `
        <div class="card-poster-wrap">
          ${yearBadge}
          ${typeBadge}
          <img class="card-poster" src="${posterUrl}" alt="${escapeHtml(item.titulo)}" loading="lazy">
          <button class="card-trailer-btn" title="Ver Trailer Oficial">🎬</button>
          <button class="card-fav-btn" title="${isFav ? 'Quitar de Mi Lista' : 'Agregar a Mi Lista'}">${isFav ? '★' : '☆'}</button>
        </div>
        <div class="card-info">
          <h3 class="card-title" title="${escapeHtml(item.titulo)}">${escapeHtml(item.titulo)}</h3>
          <div class="card-meta">
            <span>${item.categoria || (item.es_serie ? 'Serie' : 'Cine')}</span>
            <span>HD</span>
          </div>
        </div>
      `;

      // Clic para reproducir
      card.addEventListener('click', (e) => {
        if (e.target.closest('.card-fav-btn') || e.target.closest('.card-trailer-btn')) return;
        ejecutarReproduccion(item);
      });

      // Tecla Enter para reproducir
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          ejecutarReproduccion(item);
        }
      });

      // Botón favorito
      const favBtn = card.querySelector('.card-fav-btn');
      favBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFavorito(item, favBtn);
      });

      // Botón ver trailer
      const trailerBtn = card.querySelector('.card-trailer-btn');
      trailerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        abrirModalTrailer(item.titulo, item.anio);
      });

      return card;
    }

    // 3.1 SISTEMA DE TRAILERS DINÁMICOS (ESTILO NETFLIX HERO & MODAL)
    function iniciarHeroTrailer(item) {
      detenerHeroTrailer();
      if (!item || !item.titulo) return;

      // Esperar 2.2 segundos para no sobrecargar si el usuario sólo pasa de largo
      state.heroTrailerTimer = setTimeout(async () => {
        if (state.view !== 'home' || window.scrollY > 250) return;

        try {
          const res = await fetch(`/api/trailer?q=${encodeURIComponent(item.titulo)}&anio=${item.anio || ''}`);
          const data = await res.json();

          if (data && data.videoId && state.view === 'home' && window.scrollY < 250) {
            state.heroTrailerVideoId = data.videoId;
            state.heroSoundMuted = true;
            el.heroSoundBtn.innerText = '🔇';
            el.heroSoundBtn.title = 'Activar sonido';

            // Cargar iframe de YouTube en bucle silencioso
            const embedUrl = `https://www.youtube-nocookie.com/embed/${data.videoId}?enablejsapi=1&autoplay=1&mute=1&controls=0&loop=1&playlist=${data.videoId}&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3`;
            el.heroVideoFrame.src = embedUrl;

            el.heroVideoFrame.onload = () => {
              setTimeout(() => {
                if (state.view === 'home' && el.heroVideoFrame.src) {
                  el.heroVideoWrap.classList.add('active');
                  el.heroBackdrop.classList.add('fade-out');
                  el.heroSoundBtn.style.display = 'flex';
                }
              }, 600);
            };
          }
        } catch (e) {
          console.warn('Trailer en marquesina no disponible:', e);
        }
      }, 2200);
    }

    function detenerHeroTrailer() {
      if (state.heroTrailerTimer) {
        clearTimeout(state.heroTrailerTimer);
        state.heroTrailerTimer = null;
      }
      if (el.heroVideoWrap) el.heroVideoWrap.classList.remove('active');
      if (el.heroBackdrop) el.heroBackdrop.classList.remove('fade-out');
      if (el.heroSoundBtn) el.heroSoundBtn.style.display = 'none';
      if (el.heroVideoFrame && el.heroVideoFrame.src) {
        el.heroVideoFrame.src = '';
      }
      state.heroTrailerVideoId = null;
    }

    function toggleHeroSound() {
      if (!el.heroVideoFrame || !el.heroVideoFrame.contentWindow) return;
      state.heroSoundMuted = !state.heroSoundMuted;

      if (state.heroSoundMuted) {
        el.heroVideoFrame.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
        el.heroSoundBtn.innerText = '🔇';
        el.heroSoundBtn.title = 'Activar sonido';
        showToast('Trailer en silencio 🔇');
      } else {
        el.heroVideoFrame.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
        el.heroVideoFrame.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[100]}', '*');
        el.heroSoundBtn.innerText = '🔊';
        el.heroSoundBtn.title = 'Silenciar';
        showToast('Sonido activado 🔊');
      }
    }

    // MODAL DE TRAILER OFICIAL (OPCIÓN 2)
    async function abrirModalTrailer(titulo, anio) {
      if (!titulo) return;
      detenerHeroTrailer(); // Silenciar trailer de marquesina

      el.trailerModalTitle.innerText = `🎬 Trailer Oficial: ${titulo}`;
      el.trailerModalFrame.src = '';
      el.trailerModal.style.display = 'flex';
      setTimeout(() => el.trailerModal.classList.add('open'), 10);
      showToast(`Buscando trailer de: ${titulo}...`);

      try {
        const res = await fetch(`/api/trailer?q=${encodeURIComponent(titulo)}&anio=${anio || ''}`);
        const data = await res.json();

        if (data && data.videoId) {
          el.trailerModalFrame.src = `https://www.youtube-nocookie.com/embed/${data.videoId}?autoplay=1&controls=1&modestbranding=1&rel=0`;
        } else {
          showToast('No se encontró trailer disponible para este título');
          cerrarModalTrailer();
        }
      } catch (e) {
        showToast('Error de conexión cargando trailer');
        cerrarModalTrailer();
      }
    }

    function cerrarModalTrailer() {
      el.trailerModal.classList.remove('open');
      setTimeout(() => {
        el.trailerModal.style.display = 'none';
        el.trailerModalFrame.src = '';
      }, 300);
    }

    // 4. VISTA DE CUADRÍCULA PAGINADA (SIN SCROLL INFINITO)
    async function cargarGrid(seccion, page = 1, query = '', genero = 'todos') {
      switchView('grid');
      state.section = seccion;
      state.page = page;
      state.query = query;
      state.genre = genero || 'todos';

      // Renderizar o actualizar barra de filtros de género
      renderGenrePills(seccion);

      // Obtener etiqueta legible del género si no es 'todos'
      const generos = GENRES_CONFIG[seccion] || [];
      const currGenObj = generos.find(g => g.id === state.genre);
      const generoLabel = (currGenObj && state.genre !== 'todos') ? ` (${currGenObj.icon} ${currGenObj.label})` : '';

      // Actualizar Título
      if (query) {
        el.gridTitle.innerText = `Búsqueda: "${query}"`;
        el.gridSubtitle.innerText = 'Buscando en más de 32,000 títulos...';
      } else if (seccion === 'estrenos') {
        el.gridTitle.innerText = '🔥 Últimos Estrenos (2026 - 2024)';
        el.gridSubtitle.innerText = 'Los lanzamientos más recientes del cine y streaming';
      } else if (seccion === 'peliculas') {
        el.gridTitle.innerText = `🎬 Catálogo de Películas${generoLabel}`;
        el.gridSubtitle.innerText = state.genre === 'todos' ? 'Más de 24,000 títulos disponibles' : `Filtrando por ${currGenObj ? currGenObj.label : state.genre}`;
      } else if (seccion === 'series') {
        el.gridTitle.innerText = `📺 Series y Temporadas${generoLabel}`;
        el.gridSubtitle.innerText = state.genre === 'todos' ? 'Más de 7,500 series disponibles' : `Filtrando por ${currGenObj ? currGenObj.label : state.genre}`;
      } else if (seccion === 'mi_lista') {
        el.gridTitle.innerText = '⭐ Mi Lista de Favoritos';
        el.gridSubtitle.innerText = `${state.myList.size} títulos guardados`;
      } else {
        el.gridTitle.innerText = `Sección: ${seccion.toUpperCase()}${generoLabel}`;
        el.gridSubtitle.innerText = 'Explorando títulos';
      }

      el.catalogGrid.innerHTML = `
        <div class="spinner-wrap" style="grid-column: 1 / -1;">
          <div class="spinner"></div>
        </div>
      `;

      if (seccion === 'mi_lista') {
        cargarMiLista();
        return;
      }

      const params = new URLSearchParams({
        page: state.page,
        limit: state.limit,
        q: state.query,
        seccion: seccion,
        genero: state.genre
      });

      try {
        const res = await fetch(`/api/canales?${params.toString()}`);
        const data = await res.json();

        state.totalPages = data.total_pages;
        state.totalItems = data.total;

        const infoGenero = (state.genre !== 'todos' && currGenObj) ? ` [${currGenObj.label}]` : '';
        el.gridSubtitle.innerText = `Mostrando ${(data.page - 1) * data.limit + 1} - ${Math.min(data.page * data.limit, data.total)} de ${data.total.toLocaleString()} títulos${infoGenero} (Página ${data.page} de ${data.total_pages})`;

        el.catalogGrid.innerHTML = '';
        if (!data.items || !data.items.length) {
          el.catalogGrid.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🎬</div>
              <h3>No se encontraron resultados</h3>
              <p>No hay títulos disponibles con este filtro de categoría.</p>
              <button class="btn-back-home" onclick="cargarGrid('${seccion}', 1, '', 'todos')">Ver Todos en ${seccion === 'peliculas' ? 'Películas' : 'Series'}</button>
            </div>
          `;
          el.paginationBar.style.display = 'none';
          return;
        }

        data.items.forEach(item => {
          el.catalogGrid.appendChild(createCard(item));
        });

        renderPaginador();
        el.paginationBar.style.display = 'flex';

        // Enfocar primera tarjeta en TV
        const firstCard = el.catalogGrid.querySelector('.card');
        if (firstCard && document.activeElement && document.activeElement !== el.searchInput) {
          firstCard.focus();
        }

      } catch (e) {
        console.error('Error cargando cuadrícula:', e);
      }
    }

    function abrirSeccionGrid(seccionId, titulo) {
      if (seccionId === 'estrenos') {
        setActiveNav(el.btnNavEstrenos);
        cargarGrid('estrenos', 1, '', 'todos');
      } else if (seccionId === 'series_populares') {
        setActiveNav(el.btnNavSeries);
        cargarGrid('series', 1, '', 'todos');
      } else if (seccionId === 'peliculas_populares') {
        setActiveNav(el.btnNavPeliculas);
        cargarGrid('peliculas', 1, '', 'todos');
      } else if (seccionId === 'accion' || seccionId === 'terror' || seccionId === 'animacion') {
        setActiveNav(el.btnNavPeliculas);
        cargarGrid('peliculas', 1, '', seccionId);
      } else if (seccionId === 'scifi') {
        setActiveNav(el.btnNavPeliculas);
        cargarGrid('peliculas', 1, '', 'ciencia-ficcion');
      } else {
        setActiveNav(null);
        cargarGrid(seccionId, 1, '', 'todos');
      }
    }

    // 5. RENDERIZADO DE LA PAGINACIÓN (100% LIBRE DE SCROLL INFINITO)
    function renderPaginador() {
      el.paginationControls.innerHTML = '';

      if (state.totalPages <= 1) {
        el.paginationBar.style.display = 'none';
        return;
      }

      const p = state.page;
      const total = state.totalPages;

      // Botón Primera Página
      const btnFirst = document.createElement('button');
      btnFirst.className = 'page-btn';
      btnFirst.innerText = '⏮ Primera';
      btnFirst.disabled = (p === 1);
      btnFirst.addEventListener('click', () => cambiarPagina(1));
      el.paginationControls.appendChild(btnFirst);

      // Botón Anterior
      const btnPrev = document.createElement('button');
      btnPrev.className = 'page-btn';
      btnPrev.innerText = '◀ Anterior';
      btnPrev.disabled = (p === 1);
      btnPrev.addEventListener('click', () => cambiarPagina(p - 1));
      el.paginationControls.appendChild(btnPrev);

      // Rango de páginas visibles (5 páginas alrededor de la actual)
      let startP = Math.max(1, p - 2);
      let endP = Math.min(total, p + 2);

      if (startP > 1) {
        const btn1 = document.createElement('button');
        btn1.className = 'page-btn';
        btn1.innerText = '1';
        btn1.addEventListener('click', () => cambiarPagina(1));
        el.paginationControls.appendChild(btn1);

        if (startP > 2) {
          const elip = document.createElement('span');
          elip.className = 'page-ellipsis';
          elip.innerText = '...';
          elip.paginationControls = elip;
          el.paginationControls.appendChild(elip);
        }
      }

      for (let i = startP; i <= endP; i++) {
        const b = document.createElement('button');
        b.className = 'page-btn' + (i === p ? ' active' : '');
        b.innerText = i;
        b.addEventListener('click', () => cambiarPagina(i));
        el.paginationControls.appendChild(b);
      }

      if (endP < total) {
        if (endP < total - 1) {
          const elip = document.createElement('span');
          elip.className = 'page-ellipsis';
          elip.innerText = '...';
          el.paginationControls.appendChild(elip);
        }
        const btnLast = document.createElement('button');
        btnLast.className = 'page-btn';
        btnLast.innerText = total;
        btnLast.addEventListener('click', () => cambiarPagina(total));
        el.paginationControls.appendChild(btnLast);
      }

      // Botón Siguiente
      const btnNext = document.createElement('button');
      btnNext.className = 'page-btn';
      btnNext.innerText = 'Siguiente ▶';
      btnNext.disabled = (p === total);
      btnNext.addEventListener('click', () => cambiarPagina(p + 1));
      el.paginationControls.appendChild(btnNext);

      // Botón Última
      const btnEnd = document.createElement('button');
      btnEnd.className = 'page-btn';
      btnEnd.innerText = 'Última ⏭';
      btnEnd.disabled = (p === total);
      btnEnd.addEventListener('click', () => cambiarPagina(total));
      el.paginationControls.appendChild(btnEnd);

      // Actualizar input de salto
      el.jumpInput.max = total;
      el.jumpInput.value = p;
    }

    function cambiarPagina(newPage) {
      if (newPage < 1 || newPage > state.totalPages || newPage === state.page) return;
      cargarGrid(state.section, newPage, state.query, state.genre);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 6. GESTIÓN DE FAVORITOS (MI LISTA)
    function toggleFavorito(item, btn) {
      if (state.myList.has(item.id)) {
        state.myList.delete(item.id);
        if (btn) btn.innerText = '☆';
        showToast('Eliminado de Mi Lista');
      } else {
        state.myList.add(item.id);
        if (btn) btn.innerText = '★';
        showToast('Guardado en Mi Lista ⭐');
      }
      localStorage.setItem('hydra_my_list', JSON.stringify(Array.from(state.myList)));
      if (state.section === 'mi_lista') cargarMiLista();
    }

    async function cargarMiLista() {
      if (!state.myList.size) {
        el.catalogGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⭐</div>
            <h3>Tu lista está vacía</h3>
            <p>Agrega películas y series usando el botón de estrella para acceder rápidamente.</p>
            <button class="btn-back-home" onclick="cargarInicio()">Explorar Catálogo</button>
          </div>
        `;
        el.paginationBar.style.display = 'none';
        return;
      }

      // Buscar los items de la lista
      const ids = Array.from(state.myList);
      el.catalogGrid.innerHTML = '';
      el.paginationBar.style.display = 'none';

      for (const id of ids) {
        try {
          const res = await fetch(`/api/canales?q=${id}&limit=1`);
          const data = await res.json();
          if (data.items && data.items.length) {
            el.catalogGrid.appendChild(createCard(data.items[0]));
          }
        } catch (e) {}
      }
    }

    function updateHeroListBtn() {
      if (!state.heroItem) return;
      const isFav = state.myList.has(state.heroItem.id);
      el.heroBtnList.innerText = isFav ? '✓ En Mi Lista' : '+ Mi Lista';
    }

    // 7. SISTEMA DE REPRODUCCIÓN (AQUÍ VS TV)
    function ejecutarReproduccion(item) {
      if (!item || !item.url) {
        showToast('Error: No se encontró URL para este título');
        return;
      }

      let targetUrl = item.url;
      // Sanitizar posibles slashes residuales
      if (targetUrl.endsWith('.html/')) targetUrl = targetUrl.slice(0, -1);
      else if (targetUrl.endsWith('.php/')) targetUrl = targetUrl.slice(0, -1);

      if (state.playbackTarget === 'here') {
        showToast('💻 Abriendo: ' + item.titulo);
        if (item.tipo === 'directo') {
          window.open('/reproductor?url=' + encodeURIComponent(targetUrl) + '&titulo=' + encodeURIComponent(item.titulo), '_blank');
        } else {
          window.open(targetUrl, '_blank');
        }
      } else {
        showToast('📺 Enviando a la TV: ' + item.titulo + '...');
        fetch('/play/' + item.id, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ opcion_url: targetUrl })
        })
        .then(res => res.json())
        .then(data => {
          if (data.error) showToast('Error: ' + data.error);
          else showToast('✅ Reproduciendo en TV: ' + item.titulo);
        })
        .catch(() => showToast('Error de conexión con la TV'));
      }
    }

    function updatePlaybackTargetUI() {
      if (state.playbackTarget === 'here') {
        el.btnPlayHere.classList.add('active');
        el.btnPlayTv.classList.remove('active');
      } else {
        el.btnPlayTv.classList.add('active');
        el.btnPlayHere.classList.remove('active');
      }
    }

    function showToast(msg) {
      el.toast.innerText = msg;
      el.toast.classList.add('show');
      setTimeout(() => el.toast.classList.remove('show'), 3200);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 8. EVENT LISTENERS & CONTROL REMOTO
    function setupEventListeners() {
      // Navegación Header
      el.brandLogo.addEventListener('click', cargarInicio);
      el.btnNavInicio.addEventListener('click', cargarInicio);
      el.btnNavEstrenos.addEventListener('click', () => {
        setActiveNav(el.btnNavEstrenos);
        state.genre = 'todos';
        cargarGrid('estrenos', 1, '', 'todos');
      });
      el.btnNavPeliculas.addEventListener('click', () => {
        setActiveNav(el.btnNavPeliculas);
        state.genre = 'todos';
        cargarGrid('peliculas', 1, '', 'todos');
      });
      el.btnNavSeries.addEventListener('click', () => {
        setActiveNav(el.btnNavSeries);
        state.genre = 'todos';
        cargarGrid('series', 1, '', 'todos');
      });
      el.btnNavMiLista.addEventListener('click', () => {
        setActiveNav(el.btnNavMiLista);
        state.genre = 'todos';
        cargarGrid('mi_lista', 1, '', 'todos');
      });

      el.btnGridBack.addEventListener('click', cargarInicio);

      // Hero Buttons
      el.heroBtnPlay.addEventListener('click', () => {
        if (state.heroItem) ejecutarReproduccion(state.heroItem);
      });
      el.heroBtnTv.addEventListener('click', () => {
        if (state.heroItem) {
          const originalTarget = state.playbackTarget;
          state.playbackTarget = 'tv';
          ejecutarReproduccion(state.heroItem);
          state.playbackTarget = originalTarget;
        }
      });
      el.heroBtnList.addEventListener('click', () => {
        if (state.heroItem) {
          toggleFavorito(state.heroItem);
          updateHeroListBtn();
        }
      });
      el.heroBtnTrailer.addEventListener('click', () => {
        if (state.heroItem) abrirModalTrailer(state.heroItem.titulo, state.heroItem.anio);
      });
      el.heroSoundBtn.addEventListener('click', toggleHeroSound);

      // Eventos del Modal de Trailer Oficial
      el.trailerModalClose.addEventListener('click', cerrarModalTrailer);
      el.trailerModalBackdrop.addEventListener('click', cerrarModalTrailer);

      // Pausar trailer de marquesina al hacer scroll hacia abajo
      let scrollTimer;
      window.addEventListener('scroll', () => {
        if (state.view === 'home') {
          if (window.scrollY > 260) {
            detenerHeroTrailer();
          } else if (window.scrollY < 60 && !el.heroVideoFrame.src && state.heroItem) {
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
              if (window.scrollY < 60 && state.view === 'home' && state.heroItem) {
                iniciarHeroTrailer(state.heroItem);
              }
            }, 800);
          }
        }
      }, { passive: true });

      // Target Switcher
      el.btnPlayHere.addEventListener('click', () => {
        state.playbackTarget = 'here';
        updatePlaybackTargetUI();
        showToast('Modo: Los videos se abrirán en este navegador');
      });
      el.btnPlayTv.addEventListener('click', () => {
        state.playbackTarget = 'tv';
        updatePlaybackTargetUI();
        showToast('Modo: Los videos se lanzarán en la TV (Ubuntu)');
      });

      // Buscador
      let debounceTimer;
      el.searchInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        el.btnClearSearch.style.display = val ? 'block' : 'none';
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          if (val.length >= 2) {
            setActiveNav(null);
            state.genre = 'todos';
            cargarGrid('todos', 1, val, 'todos');
          } else if (!val && state.view === 'grid') {
            cargarInicio();
          }
        }, 300);
      });

      el.searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = el.searchInput.value.trim();
          if (val) {
            setActiveNav(null);
            state.genre = 'todos';
            cargarGrid('todos', 1, val, 'todos');
          }
        }
      });

      el.btnClearSearch.addEventListener('click', () => {
        el.searchInput.value = '';
        el.btnClearSearch.style.display = 'none';
        if (state.view === 'grid') cargarInicio();
      });

      // Salto de Página
      el.btnJump.addEventListener('click', () => {
        const val = parseInt(el.jumpInput.value, 10);
        if (!isNaN(val)) cambiarPagina(val);
      });

      el.jumpInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = parseInt(el.jumpInput.value, 10);
          if (!isNaN(val)) cambiarPagina(val);
        }
      });

      // SOPORTE PARA CONTROL REMOTO / TECLADO
      document.addEventListener('keydown', (e) => {
        // Atajo para buscar con tecla '/'
        if (e.key === '/' && document.activeElement !== el.searchInput) {
          e.preventDefault();
          el.searchInput.focus();
          el.searchInput.select();
          return;
        }

        // Tecla Escape para salir del buscador o cerrar el modal de trailer
        if (e.key === 'Escape') {
          if (el.trailerModal.classList.contains('open')) {
            cerrarModalTrailer();
            return;
          }
          if (document.activeElement === el.searchInput) {
            el.searchInput.blur();
          } else if (state.view === 'grid') {
            cargarInicio();
          }
          return;
        }

        // Navegación de pastillas de categoría con control remoto
        const currentPill = document.activeElement ? document.activeElement.closest('.genre-pill') : null;
        if (currentPill) {
          if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            const sibling = e.key === 'ArrowRight' ? currentPill.nextElementSibling : currentPill.previousElementSibling;
            if (sibling && sibling.classList.contains('genre-pill')) {
              e.preventDefault();
              sibling.focus();
              sibling.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
          }
          return;
        }

        // Navegación básica de flechas si estamos en tarjetas
        const currentCard = document.activeElement ? document.activeElement.closest('.card') : null;
        if (!currentCard) return;

        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          const sibling = e.key === 'ArrowRight' ? currentCard.nextElementSibling : currentCard.previousElementSibling;
          if (sibling && sibling.classList.contains('card')) {
            e.preventDefault();
            sibling.focus();
          }
        }
      });
    }

    // Arrancar aplicación
    init();
  </script>
