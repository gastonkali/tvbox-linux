<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo }} - Reproductor TV Box</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      outline: none;
    }
    .loading {
      position: absolute;
      color: #9ca3af;
      font-family: sans-serif;
      font-size: 1.2rem;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Cargando transmisión...</div>
  <video id="video" autoplay controls playsinline></video>

  <script>
    const video = document.getElementById('video');
    const loading = document.getElementById('loading');
    const streamUrl = "{{ stream_url }}";

    function onPlaySuccess() {
      if (loading) loading.style.display = 'none';
    }

    video.addEventListener('playing', onPlaySuccess);

    if (Hls.isSupported() && streamUrl.includes('.m3u8')) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 90
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {
          video.muted = true;
          video.play();
        });
      });
      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              hls.recoverMediaError();
              break;
            default:
              hls.destroy();
              break;
          }
        }
      });
    } else {
      // Reproducción nativa para MP4 o navegadores con soporte HLS integrado
      video.src = streamUrl;
      video.play().catch(() => {
        video.muted = true;
        video.play();
      });
    }
  </script>
</body>
</html>
